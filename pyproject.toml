[project]
name = "wuji-hands"
version = "0.1.0"
description = "Flow-matching behaviour cloning on a LEAP hand -- the kata ladder."
requires-python = ">=3.11,<3.13"

# Pinned to the versions the ladder was developed against (OGPO's venv).
# jax[cuda13] because this box has CUDA 13 GPUs; drop the extra for CPU-only.
dependencies = [
    "jax[cuda13]==0.9.0.1",
    "flax==0.12.4",
    "optax==0.2.6",
    "mujoco==3.5.0",
    "imageio>=2.37",
    "numpy>=2.3",
    "wandb>=0.28.1",
]

[tool.uv]
# teacher/ and student/ are put on PYTHONPATH by the Makefile, not installed.
package = false
